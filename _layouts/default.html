<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/style.css?v=5' | relative_url }}">
</head>

<body>

  <!-- FULL-WIDTH HEADER -->
  <header class="site-header">
    <h1 class="site-title">Aaron Rennick</h1>

    <div class="header-email">
      <a href="mailto:aaronrennick1221@gmail.com">aaronrennick1221@gmail.com</a>
    </div>
  </header>

  <!-- FULL-WIDTH NAV -->
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/about.html' | relative_url }}">About</a>
    <a href="{{ '/contact.html' | relative_url }}">Contact</a>
  </nav>

  <!-- CONTENT CONTAINER -->
  <main class="container">
    {{ content }}
  </main>

  <!-- FULL-WIDTH FOOTER -->
  <footer class="site-footer">
    © {{ site.time | date: "%Y" }} Aaron Rennick
    <div class="footer-email">
      <a href="mailto:aaronrennick1221@gmail.com">aaronrennick1221@gmail.com</a>
    </div>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightbox">
    <img src="" alt="">
    <span>Click anywhere to close</span>
  </div>

  <script>
    // LIGHTBOX FUNCTIONALITY
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');

    document.addEventListener('click', (e) => {
      const img = e.target.closest('.square-gallery img, .project-card-thumb img');
      if (img) {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      } else if (e.target === lightbox || e.target.closest('#lightbox span')) {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
      }
    });
  </script>

</body>
</html>
