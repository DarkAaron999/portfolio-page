<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Title / SEO -->
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  {{ page.url | absolute_url }}

  <!-- Theme color for mobile browser UI -->
  <meta name="theme-color" content="#11192e" />

  <!-- Styles: use relative_url so it works with baseurl (/portfolio-page) -->
  {{ 
</head>
<body>

  <!-- Skip link (keyboard accessibility) -->
  #mainSkip to content</a>

  <!-- Header -->
  <header role="banner">
    <h1>Aaron Rennick — Portfolio</h1>
    <p>Neon Gamer Portfolio</p>
  </header>

  <!-- Primary navigation -->
  <nav aria-label="Primary">
    <!-- Use relative_url to resolve with baseurl -->
    {{ Home</a>
    {{ About</a>
    {{ Contact</a>
    mailto:your.email@example.comEmail Me</a>
  </nav>

  <!-- Main content (injected from each page) -->
  <main id="main" class="container" role="main">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer role="contentinfo">
    © {{ site.time | date: "%Y" }} {{ site.title | default: "Aaron Rennick" }} — Gamer Mode 🎮
  </footer>

</body>
</html>
